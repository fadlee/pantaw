name: Release Pantaw

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

jobs:
  build-binaries:
    name: Build Agent Binary (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            ext: ""
          - goos: linux
            goarch: arm64
            ext: ""
          - goos: darwin
            goarch: amd64
            ext: ""
          - goos: darwin
            goarch: arm64
            ext: ""
          - goos: freebsd
            goarch: amd64
            ext: ""
          - goos: windows
            goarch: amd64
            ext: ".exe"
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: apps/agent/go.sum

      - name: Build binary
        working-directory: ./apps/agent
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          mkdir -p ../../artifacts
          OUTPUT_NAME="pantaw-agent-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}"
          go build -ldflags="-s -w -X main.Version=${{ github.ref_name }}" -o "../../artifacts/${OUTPUT_NAME}" .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.goos }}-${{ matrix.goarch }}
          path: artifacts/*
          retention-days: 1

  create-release:
    name: Create GitHub Release
    needs: build-binaries
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all release artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Generate Checksums
        working-directory: release-artifacts
        run: |
          sha256sum * > checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Pantaw Release ${{ github.ref_name }}
          files: |
            release-artifacts/*
          generate_release_notes: true

  docker-publish:
    name: Build & Push Agent Docker Image
    needs: build-binaries
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download Linux AMD64 binary
        uses: actions/download-artifact@v4
        with:
          name: binary-linux-amd64
          path: apps/agent/binaries

      - name: Download Linux ARM64 binary
        uses: actions/download-artifact@v4
        with:
          name: binary-linux-arm64
          path: apps/agent/binaries

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}-agent
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./apps/agent
          file: ./apps/agent/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # Trusted publishing (OIDC): npmjs.com lists this repo and release.yml as
  # the package's trusted publisher, so no npm token is stored anywhere.
  publish-npm:
    name: Publish CLI to npm
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      # Trusted publishing needs npm >= 11.5.1; Node 22 bundles npm 10.
      - name: Update npm
        run: npm install -g npm@latest

      - name: Check CLI version matches tag
        id: version
        run: |
          CLI_VERSION=$(node -p "require('./packages/cli/package.json').version")
          if [ "v${CLI_VERSION}" != "${{ github.ref_name }}" ]; then
            echo "packages/cli is ${CLI_VERSION}, tag is ${{ github.ref_name }}" >&2
            exit 1
          fi
          # A version published by hand (e.g. the first one, before the trusted
          # publisher could be configured) is skipped instead of failing.
          if npm view "pantaw@${CLI_VERSION}" version >/dev/null 2>&1; then
            echo "pantaw@${CLI_VERSION} is already on npm, skipping publish"
            echo "published=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        if: steps.version.outputs.published != 'true'
        run: bun install --frozen-lockfile

      - name: Build client & worker
        if: steps.version.outputs.published != 'true'
        run: bun run build

      # Build before publishing, not only in prepack: npm validates `bin`
      # before prepack runs and warns that dist/cli.js is missing.
      - name: Build CLI
        if: steps.version.outputs.published != 'true'
        working-directory: ./packages/cli
        run: |
          bun run build
          bun run bundle

      # Provenance is attached automatically under trusted publishing.
      - name: Publish
        if: steps.version.outputs.published != 'true'
        working-directory: ./packages/cli
        run: npm publish --access public
