name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  server-and-client:
    name: Server & Client (Lint, Typecheck, Test)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Lint & Format Check
        run: bun run check

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build
  agent:
    name: Agent (Vet, Test, Build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: agent/go.sum

      - name: Go Vet
        working-directory: ./agent
        run: go vet ./...

      - name: Go Test
        working-directory: ./agent
        run: go test ./...

      - name: Go Build
        working-directory: ./agent
        run: go build ./...
