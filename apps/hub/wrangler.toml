name = "pantaw"
main = "./src/server/index.ts"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

# Workers Static Assets (SPA bundle).
# Vite akan output client bundle ke ./dist/client; server bundle
# di-serve oleh Worker (main di atas).
[assets]
directory = "./dist/client"
binding = "ASSETS"
not_found_handling = "single-page-application"

# D1 Database
[[d1_databases]]
binding = "DB"
database_name = "pantaw"
database_id = "70b13a79-b2b1-4148-862f-c12e018a3668"   # created via `wrangler d1 create pantaw`
migrations_dir = "./migrations"

# KV Namespaces
[[kv_namespaces]]
binding = "SESSION_KV"
id = "5ef2ea47791b4a90ae84a602638a4198"

[[kv_namespaces]]
binding = "RATE_KV"
id = "4e22de223a9a4d9e95c9184a1e20a9d3"

# Workers Rate Limiting binding (per-token, untuk /api/v1/ingest)
[[unsafe.bindings]]
name = "INGEST_LIMITER"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 15, period = 60 }

# Cron triggers (alert + status checker, metrics cleanup)
[triggers]
crons = ["*/2 * * * *", "0 2 * * *"]

# Observability
[observability]
enabled = true

# Local dev: gunakan .dev.vars untuk secrets seperti JWT_SECRET_V1
# Variabel non-secret bisa di sini:
[vars]
RETENTION_DAYS = "30"
TIMEOUT_SECONDS = "90"
